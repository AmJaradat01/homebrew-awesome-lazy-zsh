name: Publish bottles

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Tested bottle pull request number
        required: true
        type: number

concurrency:
  group: bottle-publish
  cancel-in-progress: false

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    environment: release
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@f78b97900ce6c3c9c4e99de00a999e5541eeaabb
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure release identity
        uses: Homebrew/actions/git-user-config@f78b97900ce6c3c9c4e99de00a999e5541eeaabb
      - name: Pull tested bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: brew pr-pull --debug --tap="$GITHUB_REPOSITORY" "$PULL_REQUEST"
      - name: Push bottle commit
        uses: Homebrew/actions/git-try-push@f78b97900ce6c3c9c4e99de00a999e5541eeaabb
        with:
          branch: main
